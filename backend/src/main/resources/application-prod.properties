# Production Configuration for Video Chat Application
# This file contains production-specific settings

# Server Configuration
server.port=8080
server.address=0.0.0.0
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Application Name
spring.application.name=video-chat-app

# SSL/TLS Configuration (Enable for HTTPS)
# server.ssl.enabled=true
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=videochat

# CORS Configuration
# Update with your frontend domain
cors.allowed-origins=https://yourdomain.com,https://www.yourdomain.com
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# WebSocket Configuration
websocket.allowed-origins=https://yourdomain.com,https://www.yourdomain.com
websocket.max-text-message-size=65536
websocket.max-binary-message-size=65536
websocket.send-time-limit=20000
websocket.send-buffer-size-limit=524288

# Logging Configuration
logging.level.root=INFO
logging.level.com.videochat=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.messaging=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/video-chat-app.log
logging.file.max-size=10MB
logging.file.max-history=30

# Actuator Endpoints for Health Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
management.health.websocket.enabled=true

# Connection Pool Configuration
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=video-chat-

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=false
spring.jackson.default-property-inclusion=non_null

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# Rate Limiting (requires additional dependency)
# ratelimit.enabled=true
# ratelimit.requests-per-minute=60

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Maximum Room Configuration
app.max-rooms=1000
app.max-participants-per-room=50
app.room-cleanup-interval=3600000

# Security Headers
server.servlet.session.tracking-modes=cookie
